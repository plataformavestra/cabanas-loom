<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabanas Loom — Urubici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2822; --ink2:#46544b; --cream:#f5f2ea; --paper:#fbf9f4; --wood:#9a6a3c; --wood-d:#7b4f27;
  --line:rgba(29,40,34,.14); --moss:#2f4a3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd8d3;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0}
canvas{display:block;outline:none}
header{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;z-index:5;pointer-events:none}
.brand{font-family:Fraunces,serif;font-size:26px;letter-spacing:.14em;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.45);pointer-events:auto}
.brand small{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.22em;margin-top:2px;opacity:.92}
.tag{background:rgba(251,249,244,.92);color:var(--ink);font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);pointer-events:auto}
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(29,40,34,.82);color:#fff;font-size:14px;padding:11px 18px;border-radius:999px;z-index:5;transition:opacity .4s,transform .4s;white-space:nowrap}
#hint.hide{opacity:0;transform:translateX(-50%) translateY(10px);pointer-events:none}
.pin{position:absolute;left:0;top:0;z-index:4;transform:translate(-50%,-100%);pointer-events:none;transition:opacity .35s}
.pin button{pointer-events:auto;cursor:pointer;border:0;background:var(--paper);color:var(--ink);font:600 13px Inter,sans-serif;padding:9px 14px 9px 12px;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.28);display:flex;gap:8px;align-items:center;min-height:44px}
.pin button:hover,.pin button:focus-visible{background:#fff;outline:2px solid var(--wood)}
.pin i{width:9px;height:9px;border-radius:50%;background:var(--wood);display:block;box-shadow:0 0 0 4px rgba(154,106,60,.28)}
.pin::after{content:"";display:block;width:2px;height:22px;background:rgba(255,255,255,.9);margin:0 auto;box-shadow:0 0 6px rgba(0,0,0,.35)}
.pin.off{opacity:0;pointer-events:none}
#back{position:fixed;left:22px;top:84px;z-index:6;border:0;cursor:pointer;background:var(--paper);color:var(--ink);font:600 14px Inter,sans-serif;padding:11px 16px;border-radius:999px;min-height:44px;box-shadow:0 6px 22px rgba(0,0,0,.25);display:none}
#back.on{display:block}
#inside{position:fixed;left:22px;top:140px;z-index:6;border:0;cursor:pointer;background:var(--moss);color:#fff;font:600 14px Inter,sans-serif;padding:11px 16px;border-radius:999px;min-height:44px;box-shadow:0 6px 22px rgba(0,0,0,.25);display:none}
#inside.on{display:block}
#inside:hover{background:#243a2d}
.room{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;min-height:32px;z-index:4;transform:translate(-50%,-50%);background:rgba(29,40,34,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font:600 11px Inter,sans-serif;padding:4px 9px;border-radius:999px;white-space:nowrap}
@media (max-width:760px){#inside{left:14px;top:128px}}
#back:hover{background:#fff}
#panel{position:fixed;top:16px;right:16px;width:340px;max-height:calc(100vh - 32px);background:rgba(251,249,244,.8);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.6);border-radius:16px;z-index:7;transform:translateX(calc(100% + 24px));transition:transform .6s cubic-bezier(.2,.7,.2,1);overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:18px 18px 22px}
#panel.on{transform:none}
#panel h2{font-family:Fraunces,serif;font-weight:600;font-size:24px;margin:0 0 2px;padding-right:44px;letter-spacing:.01em}
#panel .sub{color:var(--ink2);font-size:13px;margin:0 0 12px}
#close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:20px;line-height:1;color:var(--ink)}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:64px 64px;gap:6px;margin-bottom:12px}
.gal{grid-template-rows:72px 72px}
.gal button{border:0;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;background:#ccc}
.gal button:first-child{grid-row:1 / span 2}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gal button:hover img{transform:scale(1.05)}
.gal .more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,26,22,.45);color:#fff;font:600 13px Inter,sans-serif}
.pact{display:none;gap:8px;margin:0 0 12px}
.pact button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--ink);font:600 13px Inter,sans-serif;padding:9px 10px;border-radius:999px;cursor:pointer;min-height:40px}
.pact button.pri{background:var(--moss);color:#fff;border-color:var(--moss)}
#lb{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.92);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
.gal button:nth-child(n+4){display:none}
#lbt{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
#lbt::-webkit-scrollbar{display:none}
.lbs{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center}
.lbs img{max-width:92vw;max-height:84vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.28)}
#lbp{left:18px;top:50%;transform:translateY(-50%)}#lbn{right:18px;top:50%;transform:translateY(-50%)}#lbx{right:18px;top:18px}
#mp{position:fixed;inset:0;z-index:41;background:rgba(10,14,12,.6);display:none;align-items:center;justify-content:center;padding:16px}
#mp.on{display:flex}
#mpc{background:var(--paper);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:16px 16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#mpc h3{margin:0 0 2px;font-size:20px}
#mpc .loc{font-size:13px;color:var(--ink2);margin:0 0 10px}
#mpm{width:100%;height:min(46vh,340px);border:1px solid var(--line);border-radius:12px;background:#e8e4da;display:block}
.mpa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mpa button,.mpa a{border:1px solid var(--line);background:#fff;color:var(--ink);font:600 13px Inter,sans-serif;padding:10px;border-radius:10px;cursor:pointer;min-height:44px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.mpa .pri{background:var(--moss);color:#fff;border-color:var(--moss);grid-column:1 / -1}
#mpx{float:right;border:0;background:rgba(29,40,34,.08);width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer;color:var(--ink)}
.mapbtn{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--ink);font:600 13px Inter,sans-serif;padding:10px;border-radius:10px;cursor:pointer;min-height:44px;margin:0 0 14px}
.mapbtn:hover{border-color:var(--wood)}
#lbc{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font:500 13px Inter,sans-serif;opacity:.8}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
.fact{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.fact b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.fact span{font-size:13px}
h3{font-family:Fraunces,serif;font-weight:600;font-size:17px;margin:4px 0 6px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;color:var(--ink)}
.cal-h button:disabled{opacity:.35;cursor:default}
.cal-h strong{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:11px;text-align:center;color:var(--ink2);padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.day{aspect-ratio:1;min-height:32px;border:0;border-radius:7px;background:rgba(255,255,255,.75);font:500 12px Inter,sans-serif;color:var(--ink);cursor:pointer;border:1px solid var(--line)}
.day:hover:not(:disabled){border-color:var(--wood)}
.day:disabled{background:transparent;border-color:transparent;color:#8a948d;cursor:default}
.day.blk{background:repeating-linear-gradient(45deg,#e8e4da,#e8e4da 4px,#dcd6c8 4px,#dcd6c8 8px);color:#6b6f66;text-decoration:line-through}
.day.sel{background:var(--moss);color:#fff;border-color:var(--moss)}
.day.rng{background:#dbe5dc;border-color:#dbe5dc}
.legend{font-size:12px;color:var(--ink2);margin:10px 0 0}
.sum{margin:10px 0 10px;padding:9px 12px;background:rgba(255,255,255,.7);font-size:13px;border:1px solid var(--line);border-radius:10px;font-size:14px;min-height:46px}
.cta{width:100%;border:0;background:var(--wood-d);color:#fff;font:600 14px Inter,sans-serif;padding:12px;border-radius:10px;cursor:pointer;min-height:48px}
.cta:hover{background:var(--wood)}
.day.blk.outok{cursor:pointer;border-color:var(--wood)}
.bf label{display:block;font-size:12px;color:var(--ink2);margin-bottom:8px}
.bf input,.bf select,.bf textarea{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px Inter,sans-serif;background:#fff;color:var(--ink);resize:none;box-sizing:border-box}
.bf .err{color:#a33;font-size:13px;margin:6px 0}
.bf .ck{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.4;margin:10px 0 4px}.bf .ck input{width:20px;height:20px;margin:0;padding:0;flex:none}.bf .ck a{color:var(--wood-d);text-decoration:underline}
.cta:disabled{opacity:.6;cursor:default}
.ok{font-size:14px;line-height:1.5;padding:12px;background:#e7efe6;border:1px solid #c9d9c8;border-radius:10px}
.warn{color:#a33}
.note{font-size:11px;color:var(--ink2);margin-top:10px;line-height:1.45}
#grab{display:none}
.ask{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--ink);font:600 13px Inter,sans-serif;padding:10px;border-radius:999px;cursor:pointer;min-height:42px;margin:0 0 12px}
.ask:hover{background:#fff}
#rooms{transition:opacity .3s}
#pins,#rooms{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:4;transform:translateZ(0)}
html,body{width:100%;max-width:100vw;overscroll-behavior:none}
#panel{box-sizing:border-box}
.hm{display:none}
@media (max-width:760px){.hd{display:none}.hm{display:inline}}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:20;font-size:14px;transition:transform .35s}
#toast.on{transform:translate(-50%,0)}
#dn{position:fixed;left:22px;bottom:26px;z-index:6;display:flex;gap:8px;align-items:center;border:0;cursor:pointer;background:rgba(251,249,244,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);font:600 13px Inter,sans-serif;padding:10px 14px;border-radius:999px;min-height:44px;box-shadow:0 6px 22px rgba(0,0,0,.2)}
#dn:hover{background:#fff}
@media (max-width:760px){#dn{left:auto;right:14px;top:12px;bottom:auto}}
#load{position:fixed;inset:0;z-index:30;background:#1d2822;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;letter-spacing:.2em;font-size:22px;transition:opacity .7s}
#load.off{opacity:0;pointer-events:none}
@media (max-width:760px){
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:56vh;transform:translateY(calc(100% + 16px));padding:8px 16px 18px}
  #panel.on{transform:none}
  #panel.min{max-height:var(--minh,190px);overflow:hidden}
  .pact{display:flex}
  .pact button{min-width:0;white-space:nowrap}
  body.pop #back.on,body.pop #inside.on{display:none}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px;scroll-padding:0 16px}
  .gal::-webkit-scrollbar{display:none}
  .gal button,.gal button:nth-child(n+4){display:block;flex:0 0 72%;height:132px;scroll-snap-align:start}
  .gal .more{display:none}
  #lbp,#lbn{display:none}
  #grab{display:block;width:100%;height:24px;border:0;background:transparent;cursor:pointer;padding:0;margin:0 0 4px}
  #grab::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:rgba(29,40,34,.3);margin:8px auto}
  #close{top:22px}
  .tag{display:none}
  .pin button{font-size:12px;padding:7px 11px;min-height:40px}
  .room{font-size:11px;padding:5px 8px}
  #hint{font-size:13px;bottom:18px}
  #back{left:14px;top:76px}
  header{padding:12px 14px}
  .brand{font-size:21px}
}
@media (prefers-reduced-motion:reduce){#panel,#hint,.pin{transition:none}}
</style>

<body>
<div id="load">LOOM</div>
<div id="stage"></div>
<header>
  <div class="brand">LOOM<small>CABANAS · URUBICI</small></div>
</header>
<button id="back">← Ver o terreno todo</button>
<button id="inside" type="button">Ver por dentro</button>
<div id="rooms"></div>
<div id="hint"><span class="hd">Clique em uma cabana para ver os detalhes · arraste para girar</span><span class="hm">Toque em uma cabana · arraste para girar</span></div>
<div id="pins"></div>
<aside id="panel" aria-live="polite"></aside>
<div id="toast"></div>
<div id="lb" role="dialog" aria-label="Fotos"><div id="lbt"></div><button id="lbp" type="button" aria-label="Foto anterior">‹</button><button id="lbn" type="button" aria-label="Próxima foto">›</button><button id="lbx" type="button" aria-label="Fechar fotos">×</button><div id="lbc"></div></div>
<div id="mp" role="dialog" aria-modal="true" aria-label="Como chegar"><div id="mpc"><button id="mpx" type="button" aria-label="Fechar mapa">×</button><h3>Como chegar</h3><p class="loc" id="mpl"></p><iframe id="mpm" title="Mapa da localização" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><div class="mpa"><button type="button" id="mpcp" class="pri">Copiar localização</button><a id="mpg" target="_blank" rel="noopener">Abrir no Google Maps</a><a id="mpw" target="_blank" rel="noopener">Abrir no Waze</a></div></div></div>
<button id="dn" type="button" aria-label="Alternar dia e noite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Noite</span></button>

<script src="./three.min.js"></script>
<script src="./postfx.js"></script>
<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261119);
const rr=(a,b)=>a+(b-a)*R();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- terreno ---------- */
/* Perfil do terreno: altura (m) acima do nível da rua de baixo, ao longo de z.
   z=89 rua (0 m) · z=55 início da 1ª curva (~1,8 m) · z=29,5 Loom 1 (~6,5 m)
   depois da Loom 1 a subida fica mais forte (~0,4 m por metro) */
const PROF=[[-150,104],[-60,66],[-10,36],[5,24],[18,16],[29.5,11.5],[40,8.6],[55,5.4],[70,2.7],[83,.5],[89,0],[110,-1],[150,-3]];
const PROF_M=PROF.map((p,i)=>{const a=PROF[Math.max(i-1,0)],b=PROF[Math.min(i+1,PROF.length-1)];return(b[1]-a[1])/(b[0]-a[0])});
function prof(z){
  if(z<=PROF[0][0])return PROF[0][1]+PROF_M[0]*(z-PROF[0][0]);
  const n=PROF.length-1;
  if(z>=PROF[n][0])return PROF[n][1]+PROF_M[n]*(z-PROF[n][0]);
  let i=0;while(z>PROF[i+1][0])i++;
  const x0=PROF[i][0],x1=PROF[i+1][0],h=x1-x0,t=(z-x0)/h,t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*PROF[i][1]+(t3-2*t2+t)*h*PROF_M[i]+(-2*t3+3*t2)*PROF[i+1][1]+(t3-t2)*h*PROF_M[i+1];
}
const BASE=-12.5;
const L2={x:-3,z:20,rot:-1.09};
function Hraw(x,z){
  return BASE+prof(z)
    + 0.55*Math.sin(x*0.045+1.3)*Math.cos(z*0.05)
    + 0.4*Math.sin(x*0.11+z*0.07)
    + (Math.abs(x)>60?(Math.abs(x)-60)*0.15:0);
}
const PLAT={x:L2.x,z:L2.z,r:8.5,f:6,h:0};PLAT.h=Hraw(PLAT.x,PLAT.z)-.8;
const L2c=Math.cos(L2.rot),L2s=Math.sin(L2.rot);
function dip(x,z){
  const dx=x-L2.x,dz=z-L2.z,lx=dx*L2c-dz*L2s,lz=dx*L2s+dz*L2c;
  if(lz<5.3||lz>13)return 0;
  const a=lz<7.6?(lz-5.3)/2.3:1-(lz-7.6)/5.4,ax=Math.abs(lx-.2),b=ax<4.8?1:Math.max(0,1-(ax-4.8)/2.2);
  const k=a*a*(3-2*a)*b*b*(3-2*b);
  return -1.3*k;
}
function H(x,z){
  const h=Hraw(x,z),d=Math.hypot(x-PLAT.x,z-PLAT.z);
  if(d>=PLAT.r+PLAT.f)return h+Hcut(x,z);
  let t=d<=PLAT.r?1:1-(d-PLAT.r)/PLAT.f;t=t*t*(3-2*t);
  return h+(PLAT.h-h)*t+dip(x,z);
}
function Hcut(x,z){const d=Math.hypot(x-24.6,z-33.8);if(d>4.4)return 0;const t=d<2.2?1:1-(d-2.2)/2.2;return -1.4*t*t*(3-2*t)}

/* ---------- cena ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.72;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
(function sky(){
  const c=document.createElement('canvas');c.width=8;c.height=256;
  const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#aebfca');gr.addColorStop(.55,'#d3dcd8');gr.addColorStop(1,'#e4e8e2');
  g.fillStyle=gr;g.fillRect(0,0,8,256);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t;window.__skyDay=t;
})();
scene.fog=new THREE.Fog(0xd6ded9,110,360);

const camera=new THREE.PerspectiveCamera(42,1,0.5,900);
const MOBILE=matchMedia('(max-width:760px)').matches;
let composer=null,sao=null,bloom=null,grade=null;
try{
  const rt=new (THREE.WebGLMultisampleRenderTarget||THREE.WebGLRenderTarget)(innerWidth,innerHeight,{format:THREE.RGBAFormat,type:THREE.HalfFloatType});
  if(rt.samples!==undefined)rt.samples=4;
  composer=new THREE.EffectComposer(renderer,rt);
  composer.addPass(new THREE.RenderPass(scene,camera));

    const tx=q.x-o.x,tz=q.z-o.z,l=Math.hypot(tx,tz)||1,nx=-tz/l,nz=tx/l;
    for(const s of[-1,1]){
      const x=p.x+nx*s*width/2,z=p.z+nz*s*width/2;
      verts.push(x,H(x,z)+yOff,z);uvs.push(s<0?0:1,i*uvScale);

  const g=new THREE.BufferGeometry();

  dnBtn.querySelector('svg').innerHTML=nx==='Dia'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':nx==='Noite'?'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>':'<path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M5.6 10.6l1.6 1.2M18.4 10.6l-1.6 1.2"/>';
}
function setNight(on){setMode(on?'noite':'dia')}
dnBtn.onclick=()=>setMode({tarde:'noite',noite:'dia',dia:'tarde'}[mode]);
setMode('tarde');
setInterval(()=>{if(mode==='dia')return;(window.__fires||[]).forEach(f=>{const k=.8+Math.random()*.4;f.userData.light.intensity=2.4*k;f.children.forEach((c,i)=>{if(c.isSprite)c.scale.y=(i?.55:.75)*(.85+Math.random()*.3)})})},110);
function signPreset(){const t=window.__totem,ra=window.__totemRot+.25;return{pos:new THREE.Vector3(t.x+Math.sin(ra)*8.5,t.y+1.4,t.z+Math.cos(ra)*8.5),tgt:new THREE.Vector3(t.x,t.y+.4,t.z)}}
window.__loom={open:openCabin,back:goBack,night:setNight,mode:m=>setMode(m),cam:(p,t)=>{to=null;view.pos.set(...p);view.tgt.set(...t)},ov:()=>{to=null;view.pos.copy(OVERVIEW.pos);view.tgt.copy(OVERVIEW.tgt)}};
if(location.hash==='#loom1'||location.hash==='#loom2')openCabin(location.hash.slice(1),true);
else if(location.hash==='#loom1-dentro'||location.hash==='#loom2-dentro'){const k=location.hash.slice(1,6);openCabin(k,true);setInterior(k);view.pos.copy(to.pos);view.tgt.copy(to.tgt);to=null}
else if(location.hash==='#placa')openSign(true);
else{const sp=signPreset();view.pos.copy(sp.pos);view.tgt.copy(sp.tgt);setTimeout(()=>{if(!current)flyTo(OVERVIEW,3.4)},1700);}
if(/noite/.test(location.search+location.hash))setMode('noite');else if(/dia/.test(location.search))setMode('dia');
setTimeout(()=>document.getElementById('load').classList.add('off'),450);
})();
</script>
